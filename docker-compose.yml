services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend/data:/app/data
    environment:
      PORT: "3000"
      FRONTEND_URL: "http://localhost"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:3000"
    ports:
      - "80:80"
    depends_on:
      - backend
